# 前端 nginx 配置（开发文档 §6.2 / 接口文档 §8 缺口⑧）
#
# SSE 关键点：Nginx 默认会缓冲上游响应，把流式 token 攒成整包再发，
# 首 Token 会从秒级退化到「整条链路跑完」。因此 /api/ 必须：
#     proxy_buffering off;  proxy_cache off;  proxy_set_header Connection "";
# 后端已在 routers/chat.py 里发 X-Accel-Buffering: no，两边都做才稳妥。

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 20m;   # 图片 / 文档上传

    # ---- 前端单页应用（history 路由回退到 index.html）----
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---- 上传的图片（引用卡片 / 缩略图直接 <img src> 取用）----
    location /static/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ---- 接口（含 SSE 问答）----
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 透传前端带的身份头（检索即鉴权用）
        proxy_set_header X-User-Id $http_x_user_id;
        proxy_set_header X-User-Role $http_x_user_role;

        # ==== SSE 必须关缓冲 ====
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection "";
        chunked_transfer_encoding on;
        # 长问答留足余量（图片类 P95 <= 15s，文档入库最慢）
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
