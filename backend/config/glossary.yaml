# 术语归一表（开发文档 4.3 rewrite 节点：术语归一，代码词典 + 模型兜底）
#
# 结构：
#   terms：规范词 -> 同义词列表（含中英混写、常见错写、口语说法）
#   device_models：设备别名 -> 规范型号（用于元数据过滤时把口语型号归一）
#
# 使用方式：backend/tools/kb_tools.py 的 glossary_lookup() 读取本文件，
# rewrite 节点用规范词替换同义词，并把规范词拼成额外检索式。
#
# 维护约定：术语表属配置文件，可随时追加；追加后**必须**跑一次评测
# （`scripts/eval.py`），因为改写策略会直接影响命中率。

# 规范词 -> 同义词
